name: Build SMPCore
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B package -f "$(find . -name pom.xml | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: SMPCore-jar
          path: '**/target/SMPCore-1.0.jar'
